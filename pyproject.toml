[project]
name = "camel-duo-forge"
version = "0.1.0"
description = "给一个目的，先让模型锻造出两位对谈智能体的人格与议题，再让他们对谈出一份成果"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
    "camel-ai==0.2.90",
    # camel-ai 只声明了 mcp>=1.3.0，没有上界。mcp 2.x 移除了 mcp.server.FastMCP，
    # 装上新版后 import camel 会直接 ImportError。这里必须锁 <2。
    "mcp>=1.3.0,<2",
    "python-dotenv>=1.0.1",
]

[project.scripts]
duo-forge = "duo_forge.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duo_forge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 根目录的 launcher.py 不在 src/ 包里（也不该进 wheel），测试要 import 它，
# 所以把仓库根加进 pytest 的 sys.path。只影响 pytest，不影响运行时。
pythonpath = ["."]
